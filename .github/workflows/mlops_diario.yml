name: MLOps Inferencia Diaria

on:
  schedule:
    - cron: '0 12 * * *' # Ejecuta todos los días a las 12 PM UTC (6 AM México)
  workflow_dispatch: # Permite darle clic a un botón "Run" manual en GitHub

jobs:
  vigilancia_forestal:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Instalar dependencias con uv
        run: uv sync
          
      - name: Ejecutar Pipeline Cloud
        env:
          EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }} 
        run: uv run Codigo/orquestador_cloud.py
        
      - name: Hacer Commit de las nuevas predicciones
        run: |
          git config --global user.name 'MLOps-Bot'
          git config --global user.email 'bot@tesis-mlops.com'
          git add Datos/06_Inferencia/01_Reporte_Riesgo_Regional.csv 
          git commit -m "🤖 Actualización diaria de riesgo forestal LSTM" || echo "Sin cambios hoy"
          git push