name: MLOps Inferencia Diaria

on:
  schedule:
    - cron: '0 12 * * *' # Ejecuta todos los días a las 12 PM UTC (6 AM México)
  workflow_dispatch: # Permite darle clic a un botón "Run" manual en GitHub

jobs:
  vigilancia_forestal:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # Asegura la misma versión que usas localmente
          
      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Ejecutar Pipeline Cloud
        env:
          # Si tu script de GEE necesita credenciales, se inyectan así desde los Secrets de GitHub
          EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }} 
        run: python Codigo/orquestador_cloud.py
        
      - name: Hacer Commit de las nuevas predicciones
        run: |
          git config --global user.name 'MLOps-Bot'
          git config --global user.email 'bot@tesis-mlops.com'
          # Añadimos solo el CSV final de riesgo que servirá la API
          git add Datos/06_Inferencia/01_Reporte_Riesgo_Regional.csv 
          git commit -m "🤖 Actualización diaria de riesgo forestal LSTM" || echo "Sin cambios hoy"
          git push